name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build grammar
        run: npm run build-grammar

      - name: Verify committed JSON matches source
        run: git diff --exit-code syntaxes/ofan.tmLanguage.json

      - name: Test
        run: npm test

      - name: Package
        run: npx @vscode/vsce package --no-dependencies
